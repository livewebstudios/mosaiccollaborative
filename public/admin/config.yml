# Decap CMS for the Insights section (round 3). Roz, Deb and Amalia log in at /admin/.
# Needs Netlify Identity (invite only) and Git Gateway switched on in the Netlify UI.
# Every save is a commit to main; Netlify rebuilds the site in about a minute.
backend:
  name: git-gateway
  branch: main
media_folder: "public/media/img/insights"
public_folder: "/media/img/insights"
site_url: https://themosaiccollaborative.com
display_url: https://themosaiccollaborative.com
logo_url: https://livewebstudios.com/hlink/logofaceFINAL.png
collections:
  - name: insights
    label: Insights
    label_singular: Insight
    folder: src/content/insights
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "insights/{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary (the teaser on the Insights page and in Google, under 155 characters), name: description, widget: text }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      # Options come from Settings > Blog Categories (src/data/insights-categories.json),
      # so the team can add, rename, reorder or remove categories without a code change.
      - label: Category
        name: category
        widget: relation
        collection: settings
        file: categories
        search_fields: ["categories.*.name"]
        value_field: "categories.*.name"
        display_fields: ["categories.*.name"]
        options_length: 100
      - { label: Author, name: author, widget: select, options: [Roz Cohen, Debra DeFrancesco, Amalia Egri Freedman, The Mosaic Collaborative], default: The Mosaic Collaborative }
      - { label: Featured Image, name: hero, widget: image, required: false }
      - { label: Image Description, name: heroAlt, widget: string, required: false, hint: "One short sentence describing the photo. Google reads this." }
      - { label: Link to the original (LinkedIn, Substack, podcast, event), name: externalUrl, widget: string, required: false }
      - { label: Link button text, name: externalLabel, widget: string, required: false, default: Read the original }
      - { label: Header color, name: heroAccent, widget: select, options: [navy, burgundy, gold, moss], default: navy }
      - { label: "Hide from the site (draft)", name: draft, widget: boolean, default: false, hint: "Check this to save a post without showing it on the site. Uncheck it and Publish to put it live." }
      - { label: Body, name: body, widget: markdown }

  # One editable list that feeds the Category dropdown above and the chips on /insights/.
  - name: settings
    label: Settings
    editor: { preview: false }
    files:
      - name: categories
        label: Blog Categories
        file: src/data/insights-categories.json
        description: "Add, rename, reorder or remove categories. The order here is the order of the chips on the Insights page. Renaming a category here does not change posts that already use the old name, so open those posts and pick the new one."
        fields:
          - label: Categories
            name: categories
            widget: list
            label_singular: category
            summary: "{{fields.name}}"
            collapsed: true
            min: 1
            fields:
              - { label: Name, name: name, widget: string }
