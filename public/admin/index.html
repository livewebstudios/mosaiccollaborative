<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ======================================================
    LWS DECAP ADMIN PAGE: TEMPLATE
    Standard Decap pattern: the Identity widget and Decap load with plain script tags,
    and Decap owns the login. Do NOT add a separate login button or inject Decap after
    an Identity event. Two login systems on one page cause a login loop (token
    refreshed, then revoked, in the same minute).
    Decap is pinned to exactly 3.1.2 (later builds crash on an empty optional image field).
    Branding: logo_url in config.yml puts the LWS logo on Decap's login screen.
    CUSTOMIZE: Change <title> per client. That's it.
  ====================================================== -->

  <title>The Mosaic Collaborative: Admin</title>
  <meta name="robots" content="noindex" />

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    /* Verified & Secured badge. Shown on the login screen only, hidden once someone
       is logged in so it never sits on top of the editor. */
    #lws-badge {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 1;
      line-height: 0;
    }

    #lws-badge img {
      display: block;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    #lws-badge img:hover {
      opacity: 1;
    }

    body.lws-logged-in #lws-badge {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Verified & Secured Badge -->
  <div id="lws-badge">
    <a href="https://livewebstudios.com" target="_blank" rel="noopener">
      <img
        src="https://livewebstudios.com/hlink/verifiedsecured.jpg"
        alt="Verified &amp; Secured by Live Web Studios"
      />
    </a>
  </div>

  <script>
    // Display only: toggles the badge. Does not load anything or open any login box.
    (function () {
      var id = window.netlifyIdentity;
      if (!id) return;
      function setState(user) {
        document.body.classList.toggle('lws-logged-in', !!user);
      }
      id.on('init', setState);
      id.on('login', setState);
      id.on('logout', function () { setState(null); });
    })();
  </script>

  <script src="https://unpkg.com/decap-cms@3.1.2/dist/decap-cms.js"></script>

</body>
</html>
