<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 355 265" width="355" height="265" role="img" aria-label="The Mosaic Collaborative mark">
  <!--
    Animatable reinterpretation of the Mosaic "M" mark. Each <polygon> is one tile with a data-tile index
    so GSAP / CSS can stagger them (fly-in, assemble, hover scatter). The PNG lockup is the canonical logo.
    Brand tokens: navy #1E3A5F  burgundy #8B1A3A  gold #D4942A  slate #7A9BB5
  -->
  <g id="tiles" fill-rule="evenodd" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round">
    <!-- column 0 (left pillar) -->
    <polygon data-tile="1"  fill="#D4942A" points="0,0 0,85 85,85"/>
    <polygon data-tile="2"  fill="#1E3A5F" points="0,0 85,0 85,85"/>
    <polygon data-tile="3"  fill="#8B1A3A" points="0,90 0,175 85,175"/>
    <polygon data-tile="4"  fill="#7A9BB5" points="0,90 85,90 85,175"/>
    <polygon data-tile="5"  fill="#1E3A5F" points="0,180 0,265 85,265"/>
    <polygon data-tile="6"  fill="#D4942A" points="0,180 85,180 85,265"/>
    <!-- column 1 (inner left arm of the M, diagonal runs top-left to center) -->
    <polygon data-tile="7"  fill="#7A9BB5" points="90,0 175,0 175,85"/>
    <polygon data-tile="8"  fill="#1E3A5F" points="90,0 90,85 175,85"/>
    <polygon data-tile="9"  fill="#1E3A5F" points="90,90 175,90 175,175"/>
    <!-- column 2 (inner right arm of the M, diagonal runs top-right to center) -->
    <polygon data-tile="11" fill="#8B1A3A" points="180,0 265,0 180,85"/>
    <polygon data-tile="12" fill="#1E3A5F" points="265,0 265,85 180,85"/>
    <polygon data-tile="13" fill="#7A9BB5" points="180,90 265,90 180,175"/>
    <!-- column 3 (right pillar) -->
    <polygon data-tile="15" fill="#1E3A5F" points="270,0 270,85 355,85"/>
    <polygon data-tile="16" fill="#D4942A" points="270,0 355,0 355,85"/>
    <polygon data-tile="17" fill="#7A9BB5" points="270,90 270,175 355,175"/>
    <polygon data-tile="18" fill="#8B1A3A" points="270,90 355,90 355,175"/>
    <polygon data-tile="19" fill="#8B1A3A" points="270,180 270,265 355,265"/>
    <polygon data-tile="20" fill="#1E3A5F" points="270,180 355,180 355,265"/>
  </g>
</svg>
